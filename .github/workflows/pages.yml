# Publish the committed out/ folder (rotations.html + rotations.json and the text rotations) to GitHub Pages.
# The output is generated locally (assist_fetch, assist_html) and committed; this job only deploys it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "out/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir _site
          cp -r out/. _site/
          # Serve the rotation page at the site root
          cp out/rotations.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
